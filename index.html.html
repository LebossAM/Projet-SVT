<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test de Temps de Réaction</title>
<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #b00020;
    color: white;
    height: 100vh;
    margin: 0;
}
button {
    font-size: 20px;
    padding: 15px 30px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Test de Temps de Réaction</h1>
<p>Clique quand l’écran devient vert</p>
<button id="start">Démarrer</button>
<p id="result"></p>

<script>
let startTime = null;
let testRunning = false;
let canClick = false;

const startBtn = document.getElementById("start");
const result = document.getElementById("result");

startBtn.addEventListener("click", function(e) {
    e.stopPropagation();

    // Réinitialisation
    result.textContent = "";
    document.body.style.backgroundColor = "#b00020";
    startTime = null;
    canClick = false;
    testRunning = true;

    const delay = Math.random() * 3000 + 2000;

    setTimeout(() => {
        if (!testRunning) return;
        document.body.style.backgroundColor = "#00a000";
        startTime = performance.now();
        canClick = true;
    }, delay);
});

document.body.addEventListener("click", function() {
    if (!canClick || !testRunning) return;

    const reaction = performance.now() - startTime;
    result.textContent = `Temps de réaction : ${reaction.toFixed(1)} ms`;

    // Fin du test
    canClick = false;
    testRunning = false;
    startTime = null;
});
</script>

</body>
</html>
